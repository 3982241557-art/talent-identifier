# ============================================================
#  Zeabur 部署配置（v15.1）
# ============================================================
#
#  【架构前提】
#  本项目是**单进程**应用：
#    · Vite 构建前端 → dist/
#    · Express 同时提供 API 与 dist/ 静态资源
#    · 一个端口、一个进程、一个容器
#
#  所以 Zeabur 只需启动 `npm start` 即可，
#  不需要拆分前后端、不需要 nginx、不需要反向代理。
#
#  【平台自动注入的环境变量】
#  · PORT              —— 平台分配，app.listen(PORT) 自动使用
#  · DEEPSEEK_API_KEY  —— **必须手动在 Zeabur 控制台添加**
#
#  ⚠️ server/.env 不会随代码上传（已被 .gitignore 排除），
#     所有密钥必须在 Zeabur 控制台的 Variables 里配置。
# ============================================================

# 构建阶段：安装依赖 + 构建前端
build:
  - npm install
  - npm run build

# 运行阶段：启动 Express（同时托管 API 与前端）
start:
  - npm start
