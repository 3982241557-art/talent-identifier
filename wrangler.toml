# ============================================================
#  Cloudflare Pages 配置（v15.3）
# ============================================================
#
#  【架构】
#  Cloudflare Pages = 静态资源 + Pages Functions（Workers 运行时）
#
#    · 静态资源  → Vite 构建产物（dist/）
#    · Functions  → functions/api/[[path].js]
#      捕获 /api/* 的全部请求，转发到 Express 应用逻辑
#
#  同一个域名、一次部署，前后端天然同源 —— 无跨域、无预检。
#
#  【重要：Functions 与静态资源的优先级】
#  Pages 的 Functions 只在 **functions/ 目录**存在时启用。
#  路由优先级：Functions > 静态资源 > SPA 兜底。
#  所以 /api/* 一定先进 Functions，其余路径才落到静态资源。
#
#  ============================================================
#  v15.3 · 修复 "Missing entry-point to Worker script or to assets directory"
#  ============================================================
#
#  【报错的真实原因】
#  这个报错说的是「找不到产物」，但根因通常在**构建阶段**：
#
#    Cloudflare Pages 的构建环境默认 NODE_ENV=production
#      → npm install / npm ci 跳过 devDependencies
#      → typescript 与 vite 没装上
#      → `sh: tsc: command not found`
#      → vite build 从未执行
#      → dist/ 目录根本不存在
#      → Cloudflare 找不到 assets directory → 报 Missing entry-point
#
#  【本仓库的应对】
#    package.json 的 build 脚本已改为 `node scripts/cloud-build.mjs`，
#    它会：
#      1. 检查 tsc / vite 是否可用
#      2. 缺失则自动 `npm install --include=dev` 补装
#      3. 生成语料库静态模块 → 类型检查 → Vite 构建
#      4. 校验 dist/index.html 是否真的产出，不产出直接报错退出
#
#    所以无论控制台的 Build command 填的是
#    `npm run build`、`npm ci && npm run build` 还是别的组合，
#    都能走到同一条可靠路径。
#
#  【环境变量】
#  在 Cloudflare 控制台配置（不要写进代码）：
#    DEEPSEEK_API_KEY  —— 必填，选 Secret 类型
#    DEEPSEEK_BASE_URL —— 可选，默认 https://api.deepseek.com
#    DEEPSEEK_MODEL    —— 可选，默认 deepseek-chat
#
#  ⚠️ 本文件**故意不写 [vars]**：
#     Pages 会把 wrangler.toml 里的 [vars] 与控制台设置合并，
#     两边同时存在容易互相覆盖、难以排查。
#     唯一真相源是 Cloudflare 控制台。
# ============================================================

name = "talent-identifier"

# 静态资源目录 —— 必须与 Vite 的 build.outDir 一致
# vite.config.ts 未显式设置 outDir，Vite 默认就是 dist
pages_build_output_dir = "./dist"

# Workers 运行时版本
compatibility_date = "2025-01-01"

# 构建命令 —— 与 package.json 的 build 脚本一致
# 控制台若已填写 Build command，优先级更高；此处作为 CLI 部署与兜底
[build]
command = "npm run build"

# 注意：DEEPSEEK_API_KEY 是敏感信息，
# 请在 Cloudflare 控制台的 Settings → Environment variables 里
# 添加为 **Secret**（加密类型），不要写进本文件。
