# ============================================================
#  Cloudflare Workers 配置（v15.6）
# ============================================================
#
#  ============================================================
#  v15.6 · 确认部署目标是 Worker（不是 Pages）
#  ============================================================
#
#  【证据】
#  线上域名是 talent-identifier.3982241557.workers.dev
#    → 格式为 <worker名>.<账户ID>.workers.dev，是 Worker 的命名规则
#    → Pages 应该是 <项目名>.pages.dev
#  实测 talent-identifier.pages.dev 的 DNS 不存在 → Pages 域名从未生效
#
#  Cloudflare 官方正在把 Pages 项目**自动迁移**到 Workers 平台：
#    "Pages is gradually being unified into the Workers platform...
#     eventually existing Pages projects will be migrated to Workers automatically"
#
#  控制台显示 "workers.dev Disabled" + "No URLs enabled"
#    → 这正是 Worker 的 workers.dev 路由开关（Pages 没有这个开关）
#
#  【所以】
#  项目现在是 Worker。配置必须用 Worker 形态，
#  否则 wrangler deploy 会报
#    "Missing entry-point to Worker script or to assets directory"
#
#  【架构】
#    浏览器 ──► https://talent-identifier.3982241557.workers.dev
#                ├── /api/*  → Worker（functions/_worker.js）
#                │              └─ api-handler.js + DeepSeek + 星历引擎
#                └── /*      → Workers Assets（dist/，边缘缓存）
#
#  前后端同域同源，无跨域、无预检。
# ============================================================

name = "talent-identifier"

# ------------------------------------------------------------
#  Worker 入口
# ------------------------------------------------------------
# `wrangler deploy` 会自动打包 main 指向的脚本，
# 并递归解析它的 import（包括 ../server/*.mjs）。
# 所以这里直接指源码，不必自己预打包。
#
# functions/_worker.js 的职责：
#   /api/* → api-handler.js
#   /*     → ASSETS 绑定（dist/）
main = "functions/_worker.js"

# ------------------------------------------------------------
#  workers.dev 路由
# ------------------------------------------------------------
#  ⚠️ 关键！
#  Worker 默认**不启用** workers.dev 路由，
#  于是控制台显示 "workers.dev Disabled" / "No URLs enabled"，
#  线上访问返回 HTTP 404 + "error code: 1042"。
#
#  显式设为 true 后，每次部署都会自动开启该路由，
#  不用再去控制台手动点 Enable。
workers_dev = true

# ------------------------------------------------------------
#  Workers 运行时
# ------------------------------------------------------------
# ⚠️ 这两个字段必须放在**顶层**（任何 [段] 之前）。
#    TOML 里一旦出现 [assets]，后面的键就都属于 assets 段了，
#    写成 [assets] 之后会导致 wrangler 报
#    "A compatibility_date is required when uploading a Worker"。
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------
#  静态资源（Vite 构建产物）
# ------------------------------------------------------------
[assets]
directory = "./dist"
# Worker 通过 ASSETS 绑定读取静态资源
binding = "ASSETS"
# 未命中的路径回 index.html（SPA 兜底），避免刷新页面 404
not_found_handling = "single-page-application"

# ------------------------------------------------------------
#  环境变量
# ------------------------------------------------------------
#  【重要】本文件**故意不写 [vars]**
#  wrangler.toml 的 [vars] 会与 Cloudflare 控制台的环境变量合并覆盖，
#  两边同时存在会让密钥来源分裂、极难排查。
#  唯一真相源 = Cloudflare 控制台
#  → Settings → Variables and Secrets
#
#  必填（Secret 类型）：
#    DEEPSEEK_API_KEY
#  可选（Text 类型）：
#    DEEPSEEK_BASE_URL  默认 https://api.deepseek.com
#    DEEPSEEK_MODEL     默认 deepseek-chat
# ------------------------------------------------------------
