# ============================================================
#  Cloudflare Pages 配置（v15.5 · 纯 Pages 形态）
# ============================================================
#
#  ============================================================
#  v15.5 · 关键决策：彻底回到纯 Pages 形态
# ============================================================
#
#  【v15.4 为什么失败】
#  v15.4 我把配置改成了 Workers 形态（main + [assets]），
#  因为控制台的 Deploy command 填的是 `npx wrangler deploy`。
#
#  但用户部署的是 **Pages 项目**。
#  而 wrangler 会看到 toml 里有 `main` 与 `[assets]`，
#  就把它当成 **Workers 配置**来解析 —— 于是 Pages 项目用 Workers 配置发布，
#  必然失败。
#
#  【v15.5 的决定】
#  与其让配置迁就控制台那行错误的 Deploy command，
#  不如让**配置迁就平台**。
#
#  Cloudflare Pages 的 Git 集成**根本不需要 Deploy command**：
#    · Build command      → 构建静态资源
#    · Build output dir   → Pages 自动发布这个目录
#    · Deploy command     → **留空即可**（Pages 不走 wrangler）
#
#  留空 Deploy command 后，Pages 会：
#    1. 用 `functions/` 目录自动生成 Pages Functions 路由
#    2. 把 Build output directory 当作静态资源发布
#    3. 两者在同一个域名下共存
#
#  这样连 wrangler.toml 都不需要参与 Pages 的发布流程 ——
#  但我仍然保留它，因为：
#    · `wrangler pages dev` 本地开发要用
#    · `wrangler pages functions build` 验证 Functions 能否打包
#    · 它记录了 pages_build_output_dir，是唯一的配置真相源
#
#  【所以控制台应该这样填】
#    Build command        : npm run build
#    Build output directory : dist
#    Deploy command       : （留空 / 清空 / 删除这一行）
#
#  ============================================================

name = "talent-identifier"

# ------------------------------------------------------------
#  Pages 静态资源目录
# ------------------------------------------------------------
# 必须与 vite.config.ts 的 build.outDir 一致。
# Pages 会把该目录的内容发布为静态资源。
pages_build_output_dir = "./dist"

# ------------------------------------------------------------
#  Pages Functions
# ------------------------------------------------------------
# functions/ 目录会被 Pages 自动扫描并生成路由：
#   functions/api/[[path].js  →  捕获 /api/* 的所有请求
#
# 辅助文件放在 functions/_lib/（下划线开头），
# Pages 会忽略它们，不会误建成路由。
#
# ⚠️ 不要在 toml 里写 main / [assets] —— 那是 Workers 配置，
#    混进 Pages 项目会让 wrangler 按 Workers 解析并导致发布失败。
# ------------------------------------------------------------

# ------------------------------------------------------------
#  环境变量
# ------------------------------------------------------------
#  【重要】本文件**故意不写 [vars]**
#  wrangler.toml 的 [vars] 会与 Cloudflare 控制台的环境变量合并覆盖，
#  两边同时存在会让密钥来源分裂、极难排查。
#  唯一真相源 = Cloudflare 控制台
#  → Settings → Environment variables
#
#  必填（Secret 类型）：
#    DEEPSEEK_API_KEY
#  可选（Text 类型）：
#    DEEPSEEK_BASE_URL  默认 https://api.deepseek.com
#    DEEPSEEK_MODEL     默认 deepseek-chat
# ------------------------------------------------------------
